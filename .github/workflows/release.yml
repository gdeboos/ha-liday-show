name: release
# A GitHub release for each version, so Home Assistant's Marketplace offers the integration
# (custom_components/haliday_show) as "0.2.N" with its changelog, rather than a commit hash on every merge.
on:
  push:
    branches: [main]
    paths: ["custom_components/**", "haliday_show/config.yaml", ".github/workflows/release.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release this version if it isn't yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(python -c "import json; print(json.load(open('custom_components/haliday_show/manifest.json'))['version'])")
          if gh release view "v$v" >/dev/null 2>&1; then echo "v$v already released"; exit 0; fi
          # This version's section of the changelog, without its heading.
          awk -v v="## $v" '$0==v{on=1;next} /^## /{if(on)exit} on' haliday_show/CHANGELOG.md > notes.md
          gh release create "v$v" --title "$v" --notes-file notes.md --target "$GITHUB_SHA"
