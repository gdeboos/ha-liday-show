# Publishes the AI model files HA-liday Show downloads, as GitHub release assets in this repo (run by hand
# from the Actions tab, or by a Claude session). Each is made from a pinned upstream file and checked
# against the SHA-256 that server.py's STEM_FILES expects, so a run that makes anything else fails.
name: Models

on:
  workflow_dispatch:
    inputs:
      which:
        description: "Which model to publish"
        type: choice
        options: [align, notes]
        default: align

permissions:
  contents: write

jobs:
  align:
    if: inputs.which == 'align'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Make the lyrics alignment model
        run: |
          set -euo pipefail
          pip install onnxruntime==1.29.0 onnx==1.23.2 numpy==2.5.3
          curl -sSL -o english-ls960.onnx \
            https://github.com/vcorange-chan/linewise-models/releases/download/english-ctc-ls960-v1/english-ls960.onnx
          curl -sSL -o LICENSE-MIT.txt \
            https://github.com/vcorange-chan/linewise-models/releases/download/english-ctc-ls960-v1/LICENSE-MIT.txt
          echo "00425739055e2357b9f76ddbaba10d5cb1232cbb6fb263390b084495cf456952  english-ls960.onnx" | sha256sum -c
          python -c "from onnxruntime.quantization import quantize_dynamic, QuantType; quantize_dynamic('english-ls960.onnx', 'align-en-int8.onnx', weight_type=QuantType.QUInt8)"
          echo "e57bd381bb19a790e6a998142d7ab3e1b1362734381c06e1e1fb628089d1240d  align-en-int8.onnx" | sha256sum -c
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          AI model files HA-liday Show downloads (checked by size and SHA-256 in `server.py` `STEM_FILES`). Not an app release.

          **align-en-int8.onnx**: English wav2vec 2.0 CTC (TorchAudio `WAV2VEC2_ASR_BASE_960H`, from fairseq, MIT licence, © Facebook, Inc. and its affiliates; see LICENSE-MIT.txt), for **Line up with the singing** in the Lyrics window. Made smaller (weights QUInt8, onnxruntime 1.29.0 `quantize_dynamic`) from the FP32 export `english-ls960.onnx` in vcorange-chan/linewise-models release `english-ctc-ls960-v1` (SHA-256 `00425739…cf456952`). This file: SHA-256 `e57bd381bb19a790e6a998142d7ab3e1b1362734381c06e1e1fb628089d1240d`.
          EOF
          gh release view models-align-1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create models-align-1 --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
                 --title "AI model: lyrics alignment (English)" --notes-file notes.md
          gh release upload models-align-1 align-en-int8.onnx LICENSE-MIT.txt --repo "$GITHUB_REPOSITORY" --clobber

  notes:
    # The section notes model (static/js/notesworker.js): Qwen2.5-1.5B-Instruct (Apache 2.0) as ONNX, 4-bit
    # weights with 16-bit maths, from onnx-community at a fixed commit, published here unchanged.
    if: inputs.which == 'notes'
    runs-on: ubuntu-latest
    steps:
      - name: Get the section notes model
        run: |
          set -euo pipefail
          HF=https://huggingface.co/onnx-community/Qwen2.5-1.5B-Instruct/resolve/d54957e3af1be04546436e874a60fe386041b244
          curl -sSfL -o notes-model.onnx "$HF/onnx/model_q4f16.onnx"
          curl -sSfL -o notes-tokenizer.json "$HF/tokenizer.json"
          curl -sSfL -o notes-tokenizer_config.json "$HF/tokenizer_config.json"
          curl -sSfL -o notes-config.json "$HF/config.json"
          curl -sSfL -o notes-generation_config.json "$HF/generation_config.json"
          curl -sSfL -o LICENSE-Apache-2.0.txt \
            https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct/resolve/main/LICENSE
          sha256sum -c <<'SUMS'
          19dec9f63488016185ba997d5e4492b5ac5b4f7ef1abb45243a91de958838dcd  notes-model.onnx
          a8506e7111b80c6d8635951a02eab0f4e1a8e4e5772da83846579e97b16f61bf  notes-tokenizer.json
          6a14243f0ae04884e597b3f032c05e15de9f417318fdcac24ab4e2680e691430  notes-tokenizer_config.json
          215eb99c4955b0c42ea9f6e0980d922c228950c5dbc09bde6dc451fbba4d21f3  notes-config.json
          f7e7ce458658b2d40d9eb213b91b77a8bf698845ab89360976722d7ac46928a3  notes-generation_config.json
          SUMS
          sha256sum LICENSE-Apache-2.0.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          AI model files HA-liday Show downloads (checked by size and SHA-256 in `server.py` `STEM_FILES`). Not an app release.

          **notes-model.onnx** and its **notes-*.json** files: Qwen2.5-1.5B-Instruct (Apache 2.0, © Alibaba Cloud; see LICENSE-Apache-2.0.txt), as ONNX with 4-bit weights and 16-bit maths (`model_q4f16.onnx`), unchanged from onnx-community/Qwen2.5-1.5B-Instruct at commit `d54957e3af1be04546436e874a60fe386041b244`. For writing section notes on your own device (**Write section notes with: On this device**).
          EOF
          gh release view models-notes-1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create models-notes-1 --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
                 --title "AI model: section notes (Qwen2.5-1.5B-Instruct)" --notes-file notes.md
          gh release upload models-notes-1 notes-model.onnx notes-tokenizer.json notes-tokenizer_config.json \
            notes-config.json notes-generation_config.json LICENSE-Apache-2.0.txt --repo "$GITHUB_REPOSITORY" --clobber
