configuration:
  claude_api_key:
    name: Claude API key
    description: >-
      Optional. With a key from console.anthropic.com, the editor's AI features ("Describe it", Generate with AI and the rest) ask Claude directly.
      Leave empty to use Home Assistant's AI Task instead.
  ai_task_entity:
    name: AI Task entity
    description: >-
      Optional. Which AI Task entity to use when there's no Claude API key, such as ai_task.openai_ai_task.
      Leave empty to use the only one, or Home Assistant's preferred one.
  public_port:
    name: Public page port
    description: >-
      The port for the public page, where people passing by can start a show (Setup → Settings → Public page).
      Change it only if another app already uses 18099.
