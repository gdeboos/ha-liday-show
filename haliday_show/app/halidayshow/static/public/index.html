<!doctype html>
<html lang="en" data-theme="plain" data-mode="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111418">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Light show</title>
<link rel="stylesheet" href="public.css">
<script type="module" src="public.js"></script>
</head>
<body>
<main class="pp">
  <header id="pp-header" class="pp-header">
    <img id="pp-picture" class="pp-picture" alt="" hidden>
    <div class="pp-head-text">
      <h1 id="pp-title">🎄 Light show</h1>
      <p id="pp-welcome" class="pp-welcome" hidden></p>
    </div>
    <button id="pp-install" type="button" class="pp-install" hidden></button>
  </header>
  <section id="pp-admin" class="pp-card pp-admin" hidden>
    <p id="pp-admin-text" class="pp-hint" role="status" aria-live="polite"></p>
    <div id="pp-admin-pin" class="pp-pin" hidden>
      <label for="pp-admin-input">Admin PIN</label>
      <div class="pp-pin-row">
        <input id="pp-admin-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off">
        <button id="pp-admin-ok" type="button" class="primary">Unlock</button>
      </div>
    </div>
    <div class="pp-pin-row">
      <button id="pp-admin-out" type="button" hidden>Lock this phone</button>
      <button id="pp-admin-close" type="button">Close</button>
    </div>
  </section>
  <section id="pp-locked" class="pp-card" hidden>
    <p id="pp-locked-text" class="pp-big"></p>
    <p id="pp-locked-hint" class="pp-hint"></p>
  </section>
  <section id="pp-closed" class="pp-card" hidden>
    <p id="pp-closed-text" class="pp-big"></p>
    <p id="pp-closed-hint" class="pp-hint"></p>
  </section>
  <section id="pp-warning" class="pp-card pp-warning" role="note" hidden>
    <p id="pp-warning-text"></p>
    <button id="pp-accept" type="button" class="primary" hidden></button>
  </section>
  <div id="pp-open" hidden>
    <!-- What's on, with Listen and Join: pinned to the top while the shows scroll under it. Kept slim;
         the rest (listening details, your Skip and Stop) is in the card under it, which scrolls away. -->
    <section id="pp-bar" class="pp-card pp-bar" aria-label="On now">
      <div class="pp-bar-row">
        <span id="pp-now-art" class="pp-now-art" hidden></span>
        <div class="pp-bar-now">
          <p id="pp-now" class="pp-now" role="status"></p>
          <div id="pp-progress" class="pp-progress" hidden><div id="pp-progress-fill"></div></div>
          <p id="pp-now-yours" class="pp-hint pp-now-yours" hidden></p>
        </div>
      </div>
      <div class="pp-bar-btns">
        <button id="pp-listen-btn" type="button" class="pp-listen-btn" hidden></button>
        <button id="pp-join-btn" type="button" class="pp-listen-btn pp-join-btn" hidden></button>
      </div>
    </section>
    <section id="pp-more" class="pp-card pp-more" hidden>
      <div id="pp-join-ask" class="pp-join-ask" role="group" hidden>
        <p id="pp-join-warn"></p>
        <div class="pp-pin-row">
          <button id="pp-join-ok" type="button" class="primary"></button>
          <button id="pp-join-cancel" type="button"></button>
        </div>
      </div>
      <div id="pp-listen" class="pp-listen" hidden>
        <p id="pp-listen-text" class="pp-hint" role="status" aria-live="polite"></p>
        <div id="pp-pin" class="pp-pin" hidden>
          <label for="pp-pin-input" id="pp-pin-label"></label>
          <div class="pp-pin-row">
            <input id="pp-pin-input" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off">
            <button id="pp-pin-ok" type="button" class="primary"></button>
          </div>
        </div>
        <button id="pp-nudge-open" type="button" class="pp-link-btn" aria-expanded="false" aria-controls="pp-nudge" hidden></button>
        <div id="pp-nudge" class="pp-nudge" role="group" aria-labelledby="pp-nudge-label" hidden>
          <p id="pp-nudge-label" class="pp-nudge-label"></p>
          <div class="pp-nudge-row">
            <button id="pp-nudge-earlier" type="button"></button>
            <span id="pp-nudge-value" class="pp-nudge-value" aria-live="polite"></span>
            <button id="pp-nudge-later" type="button"></button>
          </div>
          <p id="pp-nudge-hint" class="pp-hint"></p>
        </div>
        <p id="pp-listen-msg" class="pp-listen-msg" role="alert" hidden></p>
        <p id="pp-listen-tip" class="pp-hint" hidden></p>
      </div>
      <div id="pp-admin-ctl" class="pp-admin-ctl" role="group" aria-label="Admin" hidden>
        <button id="pp-admin-skip" type="button">Skip</button>
        <button id="pp-admin-stop" type="button">Stop the lights</button>
      </div>
    </section>
    <section id="pp-queue-box" class="pp-card pp-queue-box" aria-labelledby="pp-queue-head" hidden>
      <p id="pp-queue-head" class="pp-queue-head"></p>
      <ol id="pp-queue" class="pp-queue"></ol>
      <button id="pp-queue-more" type="button" class="pp-link-btn" aria-expanded="false" hidden></button>
    </section>
    <p id="pp-message" class="pp-message" role="status" aria-live="polite" hidden></p>
    <p id="pp-hours" class="pp-card pp-big pp-hours" role="status" hidden></p>
    <section id="pp-where" class="pp-card pp-where" role="status" aria-live="polite" hidden>
      <p id="pp-where-text"></p>
      <button id="pp-retry" type="button" hidden></button>
    </section>
    <p id="pp-coming" class="pp-card pp-big" hidden></p>
    <div id="pp-pick">
      <h2 id="pp-pick-head"></h2>
      <p id="pp-pick-hint" class="pp-hint"></p>
      <p id="pp-block" class="pp-block" hidden></p>
    </div>
    <div id="pp-chips" class="pp-chips" role="group" hidden></div>
    <div id="pp-choices" class="pp-list"></div>
    <p id="pp-none" class="pp-hint" hidden></p>
    <h2 id="pp-soon-head" hidden></h2>
    <div id="pp-soon" class="pp-list"></div>
  </div>
  <p id="pp-footer" class="pp-footer" hidden><a id="pp-link" rel="noopener noreferrer" target="_blank"></a></p>
</main>
<canvas id="pp-snow" class="pp-snow" aria-hidden="true" hidden></canvas>
<div id="pp-join" class="pp-join" hidden>
  <p id="pp-join-text" class="pp-join-text" role="status" aria-live="polite"></p>
  <button id="pp-join-leave" type="button" class="pp-join-leave"></button>
</div>
</body>
</html>
