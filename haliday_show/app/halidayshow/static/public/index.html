<!doctype html>
<html lang="en" data-theme="plain" data-mode="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Light show</title>
<link rel="stylesheet" href="public.css">
<script type="module" src="public.js"></script>
</head>
<body>
<main class="pp">
  <header class="pp-header">
    <img id="pp-picture" class="pp-picture" alt="" hidden>
    <h1 id="pp-title">🎄 Light show</h1>
    <p id="pp-welcome" class="pp-welcome" hidden></p>
  </header>
  <section id="pp-locked" class="pp-card" hidden>
    <p id="pp-locked-text" class="pp-big"></p>
    <p id="pp-locked-hint" class="pp-hint"></p>
  </section>
  <section id="pp-closed" class="pp-card" hidden>
    <p id="pp-closed-text" class="pp-big"></p>
    <p id="pp-closed-hint" class="pp-hint"></p>
  </section>
  <section id="pp-warning" class="pp-card pp-warning" role="note" hidden>
    <p id="pp-warning-text"></p>
    <button id="pp-accept" type="button" class="primary" hidden></button>
  </section>
  <div id="pp-open" hidden>
    <p id="pp-now" class="pp-now"></p>
    <div id="pp-mine" class="pp-list" hidden></div>
    <p id="pp-message" class="pp-message" role="status" aria-live="polite" hidden></p>
    <p id="pp-hours" class="pp-card pp-big pp-hours" role="status" hidden></p>
    <section id="pp-where" class="pp-card pp-where" role="status" aria-live="polite" hidden>
      <p id="pp-where-text"></p>
      <button id="pp-retry" type="button" hidden></button>
    </section>
    <p id="pp-coming" class="pp-card pp-big" hidden></p>
    <div id="pp-pick">
      <h2 id="pp-pick-head"></h2>
      <p id="pp-pick-hint" class="pp-hint"></p>
      <p id="pp-block" class="pp-block" hidden></p>
    </div>
    <div id="pp-choices" class="pp-list"></div>
    <p id="pp-none" class="pp-hint" hidden></p>
    <h2 id="pp-soon-head" hidden></h2>
    <div id="pp-soon" class="pp-list"></div>
  </div>
  <p id="pp-footer" class="pp-footer" hidden><a id="pp-link" rel="noopener noreferrer" target="_blank"></a></p>
</main>
<canvas id="pp-snow" class="pp-snow" aria-hidden="true" hidden></canvas>
</body>
</html>
